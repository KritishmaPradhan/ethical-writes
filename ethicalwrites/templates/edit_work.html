{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Work — Ethical Writes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Georgia, serif;
            background: #faf6f0;
            color: #2c2418;
        }
        .container {
            max-width: 850px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(44,36,24,0.08);
            padding: 32px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 24px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7a2e3b, #c9a94e);
            border: none;
        }
        .btn-secondary {
            background: #2c2418;
            border: none;
            color: white;
        }
        textarea, input {
            margin-top: 8px;
        }
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Your Work</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ user_work.title }}" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" class="form-control" value="{{ user_work.author }}" required>
            </div>
            <div class="form-group">
                <label for="freewriting">Your Work</label>
                <textarea id="freewriting" name="freewriting" class="form-control" rows="12" required>{{ user_work.freewriting }}</textarea>
            </div>
            <div class="action-row">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'view_user_work' user_work.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
